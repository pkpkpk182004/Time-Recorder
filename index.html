<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Time Recorder</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">
    <h1>Time Recorder</h1>
    <p>Record how much time you spend on a task.</p>

    <label for="task">Task name</label>
    <input id="task" type="text" placeholder="For example: Study">

    <div id="timer" class="timer">00:00:00</div>

    <div class="buttons">
      <button id="startButton">Start</button>
      <button id="stopButton" disabled>Stop and save</button>
    </div>

    <h2>Recorded sessions</h2>
    <ul id="sessions"></ul>
    <button id="clearButton" class="clear-button">Clear all sessions</button>
  </main>
</body>
</html>
